<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Flap Tap</title>
  <meta name="theme-color" content="#2c80e2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flap Tap">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="assets/icon-512.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
  <style>
    :root {
      --glass: rgba(12, 20, 33, 0.38);
      --glass-strong: rgba(10, 16, 28, 0.62);
      --text: #ffffff;
      --muted: rgba(255,255,255,.85);
      --accent: #ffe48a;
      --gold-1: #ffe89a;
      --gold-2: #ffd056;
      --gold-3: #f0ab28;
      --gold-4: #9c5d0c;
      --gold-5: #5e3304;
      --gold-shadow: rgba(86, 44, 4, 0.34);
      --menu-text-dark: #553108;
      --menu-text-soft: #6e430e;
      --menu-box: #fff0bf;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 8%, rgba(181, 232, 255, 0.52), rgba(181, 232, 255, 0) 34%),
        linear-gradient(180deg, #0b8fe9 0%, #42b8f4 44%, #87cfff 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    body {
      width: 100vw;
      height: var(--app-height, 100vh);
      height: var(--app-height, 100dvh);
      min-height: var(--app-height, -webkit-fill-available);
    }

    html {
      min-height: -webkit-fill-available;
      background-color: #0b8fe9;
    }

    .app {
      position: fixed;
      left: 0;
      top: 0;
      width: 100vw;
      height: var(--app-height, 100vh);
      height: var(--app-height, 100dvh);
      min-height: var(--app-height, -webkit-fill-available);
      padding: 0;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 8%, rgba(181, 232, 255, 0.52), rgba(181, 232, 255, 0) 34%),
        linear-gradient(180deg, #0b8fe9 0%, #42b8f4 44%, #87cfff 100%);
    }

    .stage {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--game-css-width, 100vw);
      height: var(--game-css-height, 100dvh);
      transform: translate(-50%, -50%);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      --ui-scale: 1;
    }

    .stage.mobile-fill {
      top: 0;
      transform: translateX(-50%);
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 0;
      box-shadow: none;
      background: #87cfff;
    }

    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .chips {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 10px * var(--ui-scale));
      left: calc(14px * var(--ui-scale));
      right: calc(14px * var(--ui-scale));
      display: flex;
      justify-content: space-between;
      gap: calc(10px * var(--ui-scale));
    }

    .chip {
      padding: calc(10px * var(--ui-scale)) calc(14px * var(--ui-scale));
      border-radius: calc(18px * var(--ui-scale));
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
      min-width: calc(74px * var(--ui-scale));
    }

    .chip .label {
      display: block;
      font-size: calc(11px * var(--ui-scale));
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.7);
      margin-bottom: calc(2px * var(--ui-scale));
    }

    .chip .value {
      display: block;
      width: 100%;
      text-align: right;
      font-size: calc(28px * var(--ui-scale));
      font-weight: 800;
      line-height: 1;
      color: #fff8d5;
      text-shadow: 0 2px 10px rgba(0,0,0,.18);
    }

    .panel {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: min(86%, calc(360px * var(--ui-scale)));
      padding: calc(20px * var(--ui-scale)) calc(18px * var(--ui-scale)) calc(18px * var(--ui-scale));
      border-radius: calc(24px * var(--ui-scale));
      background: rgba(10, 16, 28, 0.62);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 18px 46px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.16);
      text-align: center;
    }

    .panel.hidden { display: none; }

    .panel h1 {
      margin: 0 0 calc(8px * var(--ui-scale));
      font-size: calc(38px * var(--ui-scale));
      line-height: 1;
    }

    .subtitle {
      margin: 0;
      font-size: calc(15px * var(--ui-scale));
      line-height: 1.45;
      color: var(--muted);
    }

    .action {
      margin: calc(14px * var(--ui-scale)) 0 calc(8px * var(--ui-scale));
      font-weight: 800;
      font-size: calc(15px * var(--ui-scale));
      color: var(--accent);
    }

    .small {
      margin: 0;
      font-size: calc(13px * var(--ui-scale));
      color: rgba(255,255,255,.74);
    }

    .version-badge {
      position: absolute;
      right: calc(var(--visible-right-inset, 0px) + env(safe-area-inset-right, 0px) + 8px * var(--ui-scale));
      bottom: calc(var(--visible-bottom-inset, 0px) + env(safe-area-inset-bottom, 0px) + 6px * var(--ui-scale));
      z-index: 3;
      pointer-events: none;
      padding: calc(2px * var(--ui-scale)) calc(4px * var(--ui-scale));
      border-radius: calc(6px * var(--ui-scale));
      font-size: calc(9px * var(--ui-scale));
      font-weight: 700;
      line-height: 1;
      letter-spacing: .08em;
      color: rgba(255, 255, 255, .58);
      background: rgba(0, 30, 60, .12);
      text-shadow: 0 1px 4px rgba(0, 0, 0, .35);
      transform: translateY(0);
      opacity: 1;
      transition: transform 420ms ease, opacity 420ms ease;
    }

    .version-badge.version-exit {
      transform: translateY(calc(30px * var(--ui-scale)));
      opacity: 0;
    }

    .version-badge.version-hidden {
      display: none;
    }


    .menu-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(var(--visible-bottom-inset, 0px) + env(safe-area-inset-bottom, 0px) + 14px * var(--ui-scale));
      z-index: 7;
      pointer-events: none;
      opacity: 1;
      transform: translateY(0);
      transition: transform 420ms ease, opacity 420ms ease;
    }

    .menu-controls.menu-hidden {
      display: none;
    }

    .menu-controls.menu-exit {
      opacity: 0;
      transform: translateY(calc(44px * var(--ui-scale)));
    }

    .menu-button {
      position: absolute;
      bottom: 0;
      width: calc(52px * var(--ui-scale));
      height: calc(52px * var(--ui-scale));
      padding: 0;
      border: calc(3px * var(--ui-scale)) solid #673306;
      border-radius: calc(18px * var(--ui-scale));
      pointer-events: auto;
      cursor: pointer;
      color: #4d2602;
      background:
        radial-gradient(ellipse at 34% 20%, rgba(255,255,255,.92) 0%, rgba(255,255,255,.36) 18%, rgba(255,255,255,0) 42%),
        linear-gradient(180deg, #fff2a8 0%, #ffe05f 33%, #ffb326 58%, #b85b08 100%);
      box-shadow:
        0 calc(7px * var(--ui-scale)) 0 #4a1d00,
        0 calc(12px * var(--ui-scale)) calc(18px * var(--ui-scale)) rgba(0,0,0,.34),
        inset 0 calc(2px * var(--ui-scale)) 0 rgba(255,255,255,.78),
        inset 0 calc(-8px * var(--ui-scale)) calc(10px * var(--ui-scale)) rgba(84,31,0,.40),
        inset 0 0 0 calc(1px * var(--ui-scale)) rgba(255,248,200,.68);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
      transform: translateY(0) scale(1);
      transition: transform 140ms ease, filter 140ms ease;
    }

    .menu-button:active {
      transform: translateY(calc(2px * var(--ui-scale))) scale(.96);
      filter: brightness(1.08);
    }

    .menu-button svg {
      width: calc(24px * var(--ui-scale));
      height: calc(24px * var(--ui-scale));
      display: block;
      flex: 0 0 auto;
      filter:
        drop-shadow(0 calc(1px * var(--ui-scale)) 0 rgba(255,255,255,.48))
        drop-shadow(0 calc(2px * var(--ui-scale)) calc(2px * var(--ui-scale)) rgba(74,29,0,.26));
    }

    .menu-button-left {
      left: calc(var(--visible-right-inset, 0px) + env(safe-area-inset-left, 0px) + 14px * var(--ui-scale));
    }

    .menu-button-right {
      right: calc(var(--visible-right-inset, 0px) + env(safe-area-inset-right, 0px) + 14px * var(--ui-scale));
    }

    .game-modal {
      position: absolute;
      inset: 0;
      z-index: 9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(18px * var(--ui-scale));
      background: rgba(36, 20, 0, .22);
      pointer-events: auto;
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
    }

    .game-modal.hidden {
      display: none;
    }

    .modal-card {
      width: min(88%, calc(350px * var(--ui-scale)));
      max-height: min(76%, calc(600px * var(--ui-scale)));
      overflow: auto;
      border: calc(4px * var(--ui-scale)) solid #6b3507;
      border-radius: calc(26px * var(--ui-scale));
      padding: calc(18px * var(--ui-scale));
      color: #4f2702;
      background:
        radial-gradient(ellipse at 26% 12%, rgba(255,255,255,.72) 0%, rgba(255,255,255,.24) 18%, rgba(255,255,255,0) 42%),
        linear-gradient(180deg, #fff0a4 0%, #ffd852 28%, #ffb12a 56%, #b95d0b 100%);
      box-shadow:
        0 calc(8px * var(--ui-scale)) 0 #4a1d00,
        0 calc(20px * var(--ui-scale)) calc(42px * var(--ui-scale)) rgba(0,0,0,.34),
        inset 0 calc(3px * var(--ui-scale)) 0 rgba(255,255,255,.78),
        inset 0 calc(-16px * var(--ui-scale)) calc(22px * var(--ui-scale)) rgba(85,31,0,.30),
        inset 0 0 0 calc(1px * var(--ui-scale)) rgba(255,248,200,.60);
      text-shadow: 0 1px 0 rgba(255,255,255,.42);
    }

    .modal-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(10px * var(--ui-scale));
      margin-bottom: calc(10px * var(--ui-scale));
    }

    .modal-title {
      margin: 0;
      font-size: calc(26px * var(--ui-scale));
      line-height: 1;
      letter-spacing: .02em;
    }

    .modal-close {
      width: calc(38px * var(--ui-scale));
      height: calc(38px * var(--ui-scale));
      border: calc(3px * var(--ui-scale)) solid #673306;
      border-radius: calc(14px * var(--ui-scale));
      color: #4d2602;
      font-size: calc(22px * var(--ui-scale));
      font-weight: 950;
      cursor: pointer;
      background:
        radial-gradient(ellipse at 32% 20%, rgba(255,255,255,.86), rgba(255,255,255,0) 42%),
        linear-gradient(180deg, #fff2a8 0%, #ffd447 48%, #b85b08 100%);
      box-shadow:
        0 calc(4px * var(--ui-scale)) 0 #4a1d00,
        0 calc(8px * var(--ui-scale)) calc(10px * var(--ui-scale)) rgba(0,0,0,.22),
        inset 0 calc(2px * var(--ui-scale)) 0 rgba(255,255,255,.72),
        inset 0 calc(-5px * var(--ui-scale)) calc(7px * var(--ui-scale)) rgba(84,31,0,.34);
    }

    .setting-group,
    .stats-group {
      margin-top: calc(14px * var(--ui-scale));
      padding-top: calc(12px * var(--ui-scale));
      border-top: 1px solid rgba(113, 66, 10, .22);
    }

    .setting-label {
      display: block;
      margin: 0 0 calc(8px * var(--ui-scale));
      font-size: calc(12px * var(--ui-scale));
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--menu-text-soft);
    }

    .difficulty-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: calc(8px * var(--ui-scale));
    }

    .difficulty-option {
      border: calc(2px * var(--ui-scale)) solid #7a3d08;
      border-radius: calc(15px * var(--ui-scale));
      min-height: calc(44px * var(--ui-scale));
      padding: calc(10px * var(--ui-scale)) calc(8px * var(--ui-scale));
      cursor: pointer;
      color: #553008;
      font-weight: 950;
      font-size: calc(13px * var(--ui-scale));
      background:
        radial-gradient(ellipse at 28% 18%, rgba(255,255,255,.70), rgba(255,255,255,0) 42%),
        linear-gradient(180deg, #fff4be 0%, #ffd565 48%, #d88917 100%);
      box-shadow:
        0 calc(3px * var(--ui-scale)) 0 #5b2703,
        inset 0 calc(2px * var(--ui-scale)) 0 rgba(255,255,255,.66),
        inset 0 calc(-5px * var(--ui-scale)) calc(7px * var(--ui-scale)) rgba(84,31,0,.20);
    }

    .difficulty-option.active {
      color: #3e1d00;
      background:
        radial-gradient(ellipse at 28% 18%, rgba(255,255,255,.90), rgba(255,255,255,0) 40%),
        linear-gradient(180deg, #fff7b8 0%, #ffdf54 32%, #ffad18 60%, #9e4b05 100%);
      box-shadow:
        0 calc(4px * var(--ui-scale)) 0 #4a1d00,
        0 calc(6px * var(--ui-scale)) calc(12px * var(--ui-scale)) rgba(0,0,0,.18),
        inset 0 calc(2px * var(--ui-scale)) 0 rgba(255,255,255,.76),
        inset 0 calc(-6px * var(--ui-scale)) calc(8px * var(--ui-scale)) rgba(84,31,0,.32);
      text-shadow: 0 1px 0 rgba(255,255,255,.52);
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: calc(10px * var(--ui-scale));
      align-items: center;
      margin-top: calc(10px * var(--ui-scale));
      font-size: calc(14px * var(--ui-scale));
      font-weight: 900;
      color: var(--menu-text-dark);
      min-height: calc(24px * var(--ui-scale));
    }

    .range-row span:last-child {
      color: var(--menu-text-dark);
      font-variant-numeric: tabular-nums;
    }

    .volume-slider {
      width: 100%;
      accent-color: #d08b14;
      margin: calc(8px * var(--ui-scale)) 0 calc(4px * var(--ui-scale));
    }

    .stats-list {
      display: grid;
      gap: calc(10px * var(--ui-scale));
    }

    .stat-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(12px * var(--ui-scale));
      min-height: calc(52px * var(--ui-scale));
      padding: calc(10px * var(--ui-scale)) calc(12px * var(--ui-scale));
      border: calc(2px * var(--ui-scale)) solid #7a3d08;
      border-radius: calc(16px * var(--ui-scale));
      background:
        radial-gradient(ellipse at 24% 16%, rgba(255,255,255,.56), rgba(255,255,255,0) 42%),
        linear-gradient(180deg, #fff4be 0%, #ffd565 48%, #d88917 100%);
      box-shadow:
        0 calc(3px * var(--ui-scale)) 0 #5b2703,
        inset 0 calc(2px * var(--ui-scale)) 0 rgba(255,255,255,.60),
        inset 0 calc(-5px * var(--ui-scale)) calc(7px * var(--ui-scale)) rgba(84,31,0,.18);
    }

    .stat-name {
      font-size: calc(13px * var(--ui-scale));
      color: var(--menu-text-soft);
      font-weight: 900;
      letter-spacing: .04em;
      text-transform: uppercase;
      line-height: 1.15;
      display: flex;
      align-items: center;
      min-height: calc(24px * var(--ui-scale));
    }

    .stat-value {
      font-size: calc(24px * var(--ui-scale));
      font-weight: 950;
      color: var(--menu-text-dark);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      display: flex;
      align-items: center;
      min-height: calc(24px * var(--ui-scale));
    }

    .tap-zone {
      position: absolute;
      inset: 0;
      z-index: 4;
      background: transparent;
    }

    .footer-note {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="stage" id="stage">
      <canvas id="game" width="402" height="874" aria-label="Flap Tap game"></canvas>

      <div class="hud">
        <div class="chips" id="hudChips">
          <div class="chip">
            <span class="label">Score</span>
            <span class="value" id="score">0</span>
          </div>
          <div class="chip">
            <span class="label">Best</span>
            <span class="value" id="best">0</span>
          </div>
        </div>

        <div class="panel" id="panel">
          <h1 id="panelTitle">Flap Tap</h1>
          <p class="subtitle" id="panelSubtitle">An original tap to fly arcade game</p>
          <p class="action" id="panelAction">Tap, click, or press Space to start</p>
          <p class="small" id="panelSmall">Pass through the ancient columns.</p>
        </div>

        <div class="version-badge version-hidden" id="versionBadge" aria-hidden="true"></div>

        <div class="menu-controls menu-hidden" id="menuControls" aria-hidden="true">
          <button class="menu-button menu-button-left" id="settingsButton" type="button" aria-label="Settings">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path fill="currentColor" d="M36.8 6.5 39.2 13c1.4.5 2.7 1 4 1.7l6.2-2.9 6.1 6.1-2.9 6.2c.7 1.3 1.3 2.6 1.7 4l6.5 2.4v8.7l-6.5 2.4c-.5 1.4-1 2.7-1.7 4l2.9 6.2-6.1 6.1-6.2-2.9c-1.3.7-2.6 1.3-4 1.7l-2.4 6.5h-8.7l-2.4-6.5c-1.4-.5-2.7-1-4-1.7l-6.2 2.9-6.1-6.1 2.9-6.2c-.7-1.3-1.3-2.6-1.7-4l-6.5-2.4v-8.7l6.5-2.4c.5-1.4 1-2.7 1.7-4l-2.9-6.2 6.1-6.1 6.2 2.9c1.3-.7 2.6-1.3 4-1.7l2.4-6.5h8.7Zm-4.4 16.2a9.7 9.7 0 1 0 0 19.4 9.7 9.7 0 0 0 0-19.4Z"/>
            </svg>
          </button>
          <button class="menu-button menu-button-right" id="statsButton" type="button" aria-label="Stats">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path fill="currentColor" d="M10 51h44a4 4 0 0 1 0 8H10a4 4 0 0 1 0-8Zm5-20h9v17h-9V31Zm13-15h9v32h-9V16Zm13 8h9v24h-9V24Z"/>
            </svg>
          </button>
        </div>

        <div class="game-modal hidden" id="settingsMenu" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
          <div class="modal-card">
            <div class="modal-topline">
              <h2 class="modal-title" id="settingsTitle">Settings</h2>
              <button class="modal-close" id="settingsClose" type="button" aria-label="Close settings">×</button>
            </div>

            <div class="setting-group">
              <span class="setting-label">Difficulty</span>
              <div class="difficulty-options" id="difficultyOptions">
                <button class="difficulty-option" type="button" data-difficulty="beginner">Beginner</button>
                <button class="difficulty-option" type="button" data-difficulty="easy">Easy</button>
                <button class="difficulty-option" type="button" data-difficulty="normal">Normal</button>
                <button class="difficulty-option" type="button" data-difficulty="hard">Hard</button>
                <button class="difficulty-option" type="button" data-difficulty="explorer">Explorer</button>
              </div>
            </div>

            <div class="setting-group">
              <span class="setting-label">Audio</span>
              <label class="range-row" for="musicVolume"><span>Music</span><span id="musicVolumeValue">100%</span></label>
              <input class="volume-slider" id="musicVolume" type="range" min="0" max="100" step="1" value="100">
              <label class="range-row" for="sfxVolume"><span>Game Sounds</span><span id="sfxVolumeValue">100%</span></label>
              <input class="volume-slider" id="sfxVolume" type="range" min="0" max="100" step="1" value="100">
            </div>
          </div>
        </div>

        <div class="game-modal hidden" id="statsMenu" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
          <div class="modal-card">
            <div class="modal-topline">
              <h2 class="modal-title" id="statsTitle">Stats</h2>
              <button class="modal-close" id="statsClose" type="button" aria-label="Close stats">×</button>
            </div>

            <div class="stats-group">
              <span class="setting-label">High Score by Difficulty</span>
              <div class="stats-list">
                <div class="stat-line"><span class="stat-name">Beginner</span><span class="stat-value" id="statBestBeginner">0</span></div>
                <div class="stat-line"><span class="stat-name">Easy</span><span class="stat-value" id="statBestEasy">0</span></div>
                <div class="stat-line"><span class="stat-name">Normal</span><span class="stat-value" id="statBestNormal">0</span></div>
                <div class="stat-line"><span class="stat-name">Hard</span><span class="stat-value" id="statBestHard">0</span></div>
              </div>
            </div>

            <div class="stats-group">
              <span class="setting-label">Lifetime Stats</span>
              <div class="stats-list">
                <div class="stat-line"><span class="stat-name">Columns Passed</span><span class="stat-value" id="statColumnsPassed">0</span></div>

      // Time-of-day cycle settings. These are real gameplay seconds.
      // The clock only advances while the bird is actively in a run. If the bird
      // crashes, the current phase is held and resumes when the user starts again.
      const TIME_PHASES = ["day", "sunset", "night", "sunrise"];
      const LAYER_PHASE_GROUPS = ["foreground", "plants", "trees", "mountains", "sky"];
      const TIME_FADE_DURATION = 2;
      const TIME_FADE_STAGGER = 0.5;
      const TIME_SEGMENTS = [
        { from: "day", to: "day", seconds: 10, type: "hold" },
        { from: "day", to: "sunset", seconds: TIME_FADE_DURATION, type: "fade" },
        { from: "sunset", to: "sunset", seconds: 2, type: "hold" },
        { from: "sunset", to: "night", seconds: TIME_FADE_DURATION, type: "fade" },
        { from: "night", to: "night", seconds: 10, type: "hold" },

        { from: "sunrise", to: "sunrise", seconds: 3, type: "hold" },

      ];

      function getSegmentDuration(segment) {
        if (segment.type !== "fade" || segment.from === segment.to) return segment.seconds;
        return segment.seconds + TIME_FADE_STAGGER * (LAYER_PHASE_GROUPS.length - 1);
      }

      const TIME_CYCLE_SECONDS = TIME_SEGMENTS.reduce((total, segment) => total + getSegmentDuration(segment), 0);

      const BEST_KEY = "flap_tap_best";
      const LEGACY_BEST_KEY = "sky_hopper_best";
      const BEST_SCORES_KEY = "flap_tap_best_scores_v1";
      const SETTINGS_KEY = "flap_tap_settings_v1";
      const STATS_KEY = "flap_tap_stats_v1";

      const SETTINGS_DEFAULTS = {
        difficulty: "normal",
        musicVolume: 1,
        sfxVolume: 1
      };

      const BEST_SCORES_DEFAULTS = {
        beginner: 0,
        easy: 0,
        normal: 0,
        hard: 0
      };

      const STATS_DEFAULTS = {
        totalColumnsPassed: 0,
        totalFlaps: 0
      };

      function readJson(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return { ...fallback };
          return { ...fallback, ...JSON.parse(raw) };
        } catch (err) {
          return { ...fallback };
        }
      }

      function writeJson(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (err) {
          // Ignore storage failures so private browsing or full storage never breaks the game.
        }
      }

      function readBestScore() {
        try {
          return Number(localStorage.getItem(BEST_KEY) || localStorage.getItem(LEGACY_BEST_KEY) || 0);
        } catch (err) {
          return 0;
        }
      }

      function saveLegacyBestScore(score) {
        try {
          localStorage.setItem(BEST_KEY, String(score));
          localStorage.setItem(LEGACY_BEST_KEY, String(score));
        } catch (err) {
          // Ignore storage failures.
        }
      }

      function normalizeBestScores(raw) {
        const bests = { ...BEST_SCORES_DEFAULTS, ...(raw || {}) };
        for (const key of Object.keys(BEST_SCORES_DEFAULTS)) {
          bests[key] = Math.max(0, Number(bests[key]) || 0);
        }
        return bests;
      }

      const legacyBestScore = readBestScore();
      const settings = readJson(SETTINGS_KEY, SETTINGS_DEFAULTS);
      const bestScores = normalizeBestScores(readJson(BEST_SCORES_KEY, BEST_SCORES_DEFAULTS));
      const lifetimeStats = readJson(STATS_KEY, STATS_DEFAULTS);

      if (!bestScores.normal) {
        bestScores.normal = Math.max(bestScores.normal, legacyBestScore);
      }

      if (!["beginner", "easy", "normal", "hard", "explorer"].includes(settings.difficulty)) {
        settings.difficulty = "normal";
      }
      const loadedMusicVolume = Number(settings.musicVolume);
      const loadedSfxVolume = Number(settings.sfxVolume);
      settings.musicVolume = Number.isFinite(loadedMusicVolume) ? Math.max(0, Math.min(1, loadedMusicVolume)) : SETTINGS_DEFAULTS.musicVolume;
      settings.sfxVolume = Number.isFinite(loadedSfxVolume) ? Math.max(0, Math.min(1, loadedSfxVolume)) : SETTINGS_DEFAULTS.sfxVolume;
      lifetimeStats.totalColumnsPassed = Math.max(0, Number(lifetimeStats.totalColumnsPassed) || 0);
      lifetimeStats.totalFlaps = Math.max(0, Number(lifetimeStats.totalFlaps) || 0);
      writeJson(SETTINGS_KEY, settings);
      writeJson(BEST_SCORES_KEY, bestScores);
      writeJson(STATS_KEY, lifetimeStats);

      function saveSettings() {
        writeJson(SETTINGS_KEY, settings);

      function saveBestScores() {

        return ["beginner", "easy", "normal", "hard"].includes(settings.difficulty)
          ? settings.difficulty
          : null;
      }

      function getCurrentBestScore() {
        const key = currentScoredDifficultyKey();
        return key ? bestScores[key] || 0 : 0;
      }

      const state = {
        mode: "loading",
        t: 0,
        bgScroll: 0,
        groundScroll: 0,
        spawnTimer: 0,
        score: 0,
        best: getCurrentBestScore(),
        flash: 0,
